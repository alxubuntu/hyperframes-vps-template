services:
  # Docker creates missing bind-mount directories as root. The app runs as
  # UID 1000 (node), so repair ownership on every compose start before the app
  # can try to persist jobs or renders.
  init-data:
    image: busybox:1.36.1
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/projects /data/temp /data/videos
        chown -R 1000:1000 /data
        chmod -R u+rwX /data
    volumes:
      - ./data/projects:/data/projects
      - ./data/temp:/data/temp
      - ./data/videos:/data/videos

  hyperframes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PREVIEW_COMPOSITION_DIR: ${PREVIEW_COMPOSITION_DIR:-compositions/cloudflare-intro}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PROJECTS_DIR: /data/projects
      RENDER_TEMP_DIR: /data/temp
      RENDERS_DIR: /data/videos
      HYPERFRAMES_BIN: /app/renderer/node_modules/.bin/hyperframes
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./data/projects:/data/projects
      - ./data/temp:/data/temp
      - ./data/videos:/data/videos
    depends_on:
      init-data:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
