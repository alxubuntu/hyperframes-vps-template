services:
  # Docker creates missing bind-mount directories as root. The app runs as
  # UID 1000 (node), so repair ownership on every compose start before the app
  # can try to persist jobs or renders.
  init-data:
    image: busybox:1.36.1
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /data/projects /data/temp /data/videos
        chown -R 1000:1000 /data
        chmod -R u+rwX /data
    volumes:
      - ./data/projects:/data/projects
      - ./data/temp:/data/temp
      - ./data/videos:/data/videos

  hyperframes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PREVIEW_COMPOSITION_DIR: ${PREVIEW_COMPOSITION_DIR:-compositions/cloudflare-intro}
    restart: unless-stopped
    init: true
    # Hard CPU ceiling for this container. Each render worker starts its own
    # Chromium, so RENDER_WORKERS above the CPU count mostly competes with itself.
    cpus: 2.0
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PROJECTS_DIR: /data/projects
      RENDER_TEMP_DIR: /data/temp
      RENDERS_DIR: /data/videos
      HYPERFRAMES_BIN: /app/renderer/node_modules/.bin/hyperframes
      # Size caps. ${VAR:-default} lets .env override these without editing the
      # compose file. The request cap must stay above the composition cap: a
      # 32 MB HTML arrives as a ~32 MB JSON body, and base64 costs 4/3 on disk.
      MAX_RENDER_HTML_BYTES: ${MAX_RENDER_HTML_BYTES:-33554432}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-37748736}
      MAX_COMPOSITION_BYTES: ${MAX_COMPOSITION_BYTES:-33554432}
      # One Chromium per worker: keep this at or below the cpus limit above.
      RENDER_WORKERS: ${RENDER_WORKERS:-2}
    # Optional reverse-proxy routing. Disabled unless TRAEFIK_ENABLE is true,
    # so a deployment without Traefik behaves exactly as before. Traefik runs
    # with host networking here, so it reaches this container over its own
    # project network: no shared network and no published port are required.
    # TRAEFIK_ROUTER must be unique per instance (router names are global).
    # List syntax on purpose: Compose interpolates ${...} in values, never in
    # mapping keys, so a "traefik.http.routers.${X}.rule:" key would stay
    # literal and Traefik would drop the router.
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-false}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hyperframes}.rule=Host(`${TRAEFIK_HOST:-localhost}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hyperframes}.service=${TRAEFIK_ROUTER:-hyperframes}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hyperframes}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-hyperframes}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-hyperframes}.loadbalancer.server.port=3000"
    ports:
      # Host port. With no WEB_PORT (or an empty one) Docker assigns a free port:
      # read it back with `docker compose port hyperframes 3000`. Pin a number
      # (3001, 3002, ...) when the URL must stay stable.
      # Single dash, not ":-": an empty value must reach Docker as empty.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT-}:3000"
    volumes:
      - ./data/projects:/data/projects
      - ./data/temp:/data/temp
      - ./data/videos:/data/videos
    depends_on:
      init-data:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
